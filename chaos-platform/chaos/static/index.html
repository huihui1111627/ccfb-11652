<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>故障演练平台 · 在线挂号缴费系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>故障演练平台 <small>在线挂号缴费系统</small></h1>
  <div id="status-bar">
    <span id="resilience-badge" class="badge"></span>
    <span id="run-badge" class="badge"></span>
    <span id="client-stats"></span>
  </div>
</header>
<nav>
  <button data-tab="topology" class="active">服务拓扑</button>
  <button data-tab="plans">演练计划</button>
  <button data-tab="rules">注入规则</button>
  <button data-tab="steady">稳态指标</button>
  <button data-tab="reports">演练报告</button>
</nav>
<main>
  <section id="tab-topology" class="tab active">
    <h2>服务拓扑(实时,2s 刷新)</h2>
    <div id="topo-services" class="cards"></div>
    <h3>调用边</h3>
    <table id="topo-edges" class="tbl"></table>
  </section>

  <section id="tab-plans" class="tab">
    <div class="cols">
      <div class="col-left">
        <h2>演练计划模板</h2>
        <ul id="plan-list" class="list"></ul>
      </div>
      <div class="col-main">
        <h3>计划定义(JSON,可编辑后保存为模板)</h3>
        <textarea id="plan-json" rows="16" spellcheck="false"></textarea>
        <div class="btn-row">
          <button id="plan-save">保存模板</button>
          <button id="plan-run-on" class="primary">一键复跑(开韧性)</button>
          <button id="plan-run-off">一键复跑(关韧性)</button>
          <button id="drill-stop" class="danger">中止演练</button>
        </div>
      </div>
    </div>
    <h3>历史演练 <button id="compare-btn">对比选中的两次</button></h3>
    <table id="run-list" class="tbl"></table>
    <div id="compare-view"></div>
  </section>

  <section id="tab-rules" class="tab">
    <h2>注入规则(手工注入,立即生效)</h2>
    <div id="rule-form" class="form">
      <label>规则ID <input id="rf-id" value="manual-1"></label>
      <label>目标实例 <select id="rf-target"></select></label>
      <label>类型
        <select id="rf-type">
          <option value="latency">延迟</option>
          <option value="error">返回错误</option>
          <option value="abort">断开连接</option>
        </select></label>
      <label>延迟ms <input id="rf-latency" type="number" value="8000"></label>
      <label>错误码 <input id="rf-status" type="number" value="500"></label>
      <label>错误率 <input id="rf-errrate" type="number" step="0.1" value="1"></label>
      <label>仅标记 <input id="rf-tag" placeholder="如 chaos,空=全部"></label>
      <label>百分比 <input id="rf-percent" type="number" value="100"></label>
      <button id="rule-add">添加并启用</button>
    </div>
    <table id="rule-list" class="tbl"></table>
  </section>

  <section id="tab-steady" class="tab">
    <h2>稳态指标(演练中持续检查,偏离自动中止)</h2>
    <div id="steady-live"></div>
    <h3>下游超时建议(按历史延迟分位数)</h3>
    <div class="btn-row">
      <button id="advisor-refresh">重新计算</button>
      <button id="advisor-apply" class="primary">全部应用</button>
    </div>
    <table id="advisor-table" class="tbl"></table>
  </section>

  <section id="tab-reports" class="tab">
    <h2>演练报告</h2>
    <select id="report-select"></select>
    <div id="report-view"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
